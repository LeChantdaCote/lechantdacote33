  <style>
    /* Mosaïque irrégulière pour le trombinoscope (spécifique à cette page) */
    .mosaic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 1.5rem;
    }

    .mosaic-grid figure {
      overflow: hidden;
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .mosaic-grid figure:hover {
      transform: translateY(-3px) scale(1.015);
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    }

    .mosaic-grid img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .mosaic-grid figcaption {
      padding: 8px 10px 10px;
      font-size: 0.85rem;
      text-align: center;
      color: #ffffff;
    }

    @media (max-width: 900px) {
      .mosaic-grid { column-count: 3; }
    }
    @media (max-width: 600px) {
      .mosaic-grid { column-count: 2; column-gap: 10px; }
      .mosaic-grid figure { margin-bottom: 10px; }
      .mosaic-grid figcaption { font-size: 0.78rem; }
    }
  </style>
</head>
